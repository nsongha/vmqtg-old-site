<title>Thư Viện Ảnh — Văn Miếu Quốc Tử Giám</title>
<style>
:root {
  --brick: #8b2e2e;
  --brick-dark: #5a1818;
  --gold: #c9a14a;
  --gold-light: #e4c97e;
  --cream: #f5efe2;
  --ink: #2a221c;
  --paper: #fbf8f1;
  --muted: #6b5e52;
  --line: #d8cdb8;
  --shadow: rgba(42,34,28,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
}
header {
  background: var(--brick-dark);
  color: var(--cream);
  padding: 20px 32px 18px;
  border-bottom: 3px solid var(--gold);
}
header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.02em; }
header p { font-size: 0.82rem; color: var(--gold-light); margin-top: 3px; }
.controls {
  background: var(--cream);
  border-bottom: 1px solid var(--line);
  padding: 12px 32px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px var(--shadow);
}
.search-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.search-input {
  flex: 1; max-width: 280px;
  padding: 6px 14px;
  border: 1.5px solid var(--line);
  border-radius: 20px;
  font-size: 0.82rem;
  background: white; color: var(--ink);
  outline: none; transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--gold); }
.search-input::placeholder { color: var(--muted); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tab {
  padding: 6px 14px; border-radius: 20px;
  border: 1.5px solid var(--line);
  background: white; color: var(--muted);
  font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.tab:hover { border-color: var(--brick); color: var(--brick); }
.tab.active { background: var(--brick); border-color: var(--brick); color: white; }
.sub-tabs { display: flex; gap: 5px; flex-wrap: wrap; min-height: 28px; }
.sub-tab {
  padding: 4px 11px; border-radius: 14px;
  border: 1.5px solid var(--line);
  background: white; color: var(--muted);
  font-size: 0.76rem; font-weight: 500;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.sub-tab:hover { border-color: var(--gold); color: var(--ink); }
.sub-tab.active { background: var(--gold); border-color: var(--gold); color: var(--brick-dark); font-weight: 700; }
.count-bar { padding: 8px 32px 0; font-size: 0.78rem; color: var(--muted); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 10px;
  padding: 16px 32px 48px;
}
.card {
  position: relative; background: white;
  border-radius: 6px; overflow: hidden;
  border: 1px solid var(--line); cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  aspect-ratio: 4/3;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--shadow); border-color: var(--gold); }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--cream); }
.card-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(42,34,28,0.85));
  color: white; font-size: 0.68rem;
  padding: 18px 8px 7px;
  opacity: 0; transition: opacity 0.15s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card:hover .card-label { opacity: 1; }
.lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(10,6,3,0.94);
  z-index: 1000; align-items: center; justify-content: center; flex-direction: column;
}
.lightbox.open { display: flex; }
.lb-img { max-width: 90vw; max-height: 78vh; object-fit: contain; border-radius: 3px; box-shadow: 0 12px 60px rgba(0,0,0,0.7); }
.lb-caption { margin-top: 14px; color: var(--gold-light); font-size: 0.82rem; text-align: center; max-width: 700px; padding: 0 20px; }
.lb-caption .lb-sub { color: rgba(255,255,255,0.35); font-size: 0.72rem; margin-top: 3px; }
.lb-counter { color: rgba(255,255,255,0.3); font-size: 0.72rem; margin-top: 5px; }
.lb-close {
  position: fixed; top: 18px; right: 24px;
  background: rgba(255,255,255,0.08); border: none;
  color: rgba(255,255,255,0.7); font-size: 1.5rem;
  cursor: pointer; line-height: 1; padding: 6px 10px;
  border-radius: 6px; transition: all 0.15s;
}
.lb-close:hover { background: rgba(255,255,255,0.18); color: white; }
.lb-nav {
  position: fixed; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,0.07); border: none;
  color: rgba(255,255,255,0.7); font-size: 2.2rem;
  cursor: pointer; padding: 20px 14px;
  border-radius: 6px; transition: all 0.15s; line-height: 1;
}
.lb-nav:hover { background: rgba(255,255,255,0.17); color: white; }
.lb-prev { left: 14px; }
.lb-next { right: 14px; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>

const CAT_LABELS = {'di-tich':'Di Tích','giao-duc-di-san':'Giáo Dục Di Sản','hoat-dong':'Hoạt Động'};
const SUB_LABELS = {
  'bia-tien-si':'Bia Tiến Sĩ','danh-nhan':'Danh Nhân','kien-truc':'Kiến Trúc',
  'lich-su':'Lịch Sử','tuong-tho':'Tượng Thờ',
  'lop-1-3':'Lớp 1–3','lop-4-6':'Lớp 4–6','lop-7-12':'Lớp 7–12','mam-non':'Mầm Non',
  'hoat-dong':'Hoạt Động'
};
const SUB_BY_CAT = {
  'di-tich':['bia-tien-si','danh-nhan','kien-truc','lich-su','tuong-tho'],
  'giao-duc-di-san':['mam-non','lop-1-3','lop-4-6','lop-7-12'],
  'hoat-dong':[]
};

function readableName(s) {
  return s.replace(/^\d+-/,'').replace(/-/g,' ')
    .replace(/\b\w/g,c=>c.toUpperCase()).trim() || s;
}

let activeCat='', activeSub='', searchQ='', filtered=[], lbIdx=0;
const grid=document.getElementById('grid');
const subTabsEl=document.getElementById('sub-tabs');
const countBar=document.getElementById('count-bar');

function getFiltered() {
  return IMAGES.filter(img=>{
    if(activeCat && img.cat!==activeCat) return false;
    if(activeSub && img.sub!==activeSub) return false;
    if(searchQ){
      const q=searchQ.toLowerCase();
      const hay=(img.name+' '+(SUB_LABELS[img.sub]||img.sub)+' '+(CAT_LABELS[img.cat]||img.cat)).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderSubTabs(){
  subTabsEl.innerHTML='';
  const subs=activeCat?(SUB_BY_CAT[activeCat]||[]):[];
  if(!subs.length) return;
  const all=document.createElement('button');
  all.className='sub-tab'+(activeSub===''?' active':'');
  all.textContent='Tất cả';
  all.onclick=()=>{activeSub='';renderAll();};
  subTabsEl.appendChild(all);
  subs.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='sub-tab'+(activeSub===s?' active':'');
    btn.textContent=SUB_LABELS[s]||s;
    btn.onclick=()=>{activeSub=s;renderAll();};
    subTabsEl.appendChild(btn);
  });
}

function renderGrid(){
  filtered=getFiltered();
  grid.innerHTML='';
  const label=activeCat?(CAT_LABELS[activeCat]||activeCat):'toàn bộ';
  countBar.textContent=filtered.length+' ảnh'+(activeSub?' — '+(SUB_LABELS[activeSub]||activeSub):'');
  if(!filtered.length){
    grid.innerHTML='<div class="empty">Không tìm thấy ảnh nào.</div>';
    return;
  }
  filtered.forEach((img,i)=>{
    const card=document.createElement('div');
    card.className='card';
    const image=document.createElement('img');
    image.src=img.thumb;
    image.alt=readableName(img.name);
    image.loading='lazy';
    image.onerror=function(){if(this.src!==img.src)this.src=img.src;};
    const lbl=document.createElement('div');
    lbl.className='card-label';
    lbl.textContent=readableName(img.name);
    card.appendChild(image);
    card.appendChild(lbl);
    card.onclick=()=>openLightbox(i);
    grid.appendChild(card);
  });
}

function renderAll(){renderSubTabs();renderGrid();}

document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeCat=btn.dataset.cat;
    activeSub='';
    renderAll();
  };
});

document.getElementById('search').addEventListener('input',e=>{
  searchQ=e.target.value.trim();
  renderAll();
});

function openLightbox(idx){
  lbIdx=idx; showLb();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}
function showLb(){
  const img=filtered[lbIdx];
  document.getElementById('lb-img').src=img.src;
  document.getElementById('lb-img').alt=readableName(img.name);
  document.getElementById('lb-name').textContent=readableName(img.name);
  const sl=SUB_LABELS[img.sub]||img.sub;
  const cl=CAT_LABELS[img.cat]||img.cat;
  document.getElementById('lb-sub').textContent=cl+(sl&&sl!==cl?' › '+sl:'');
  document.getElementById('lb-counter').textContent=(lbIdx+1)+' / '+filtered.length;
}
document.getElementById('lb-close').onclick=closeLightbox;
document.getElementById('lb-prev').onclick=()=>{lbIdx=(lbIdx-1+filtered.length)%filtered.length;showLb();};
document.getElementById('lb-next').onclick=()=>{lbIdx=(lbIdx+1)%filtered.length;showLb();};
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target===e.currentTarget)closeLightbox();});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft'){lbIdx=(lbIdx-1+filtered.length)%filtered.length;showLb();}
  if(e.key==='ArrowRight'){lbIdx=(lbIdx+1)%filtered.length;showLb();}
});

renderAll();
</script>
</body>
</html>
