name: CI (vmqtg-production)

on:
  pull_request:
    paths:
      - 'vmqtg-production/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'vmqtg-production/**'
      - '.github/workflows/ci.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vmqtg-production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: vmqtg-production/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Lint (best-effort, non-blocking)
        run: pnpm exec next lint || true
